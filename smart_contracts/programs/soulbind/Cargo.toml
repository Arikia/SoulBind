[package]
name = "soulbind"
version = "0.1.0"
description = "SoulBind identity document program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "soulbind"

[features]
no-entrypoint = []
no-idl = []
no-log-ip = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
